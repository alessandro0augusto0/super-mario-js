<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="css/styles.css">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Super Mario Runner</title>
</head>

<body>
  <div class="menu">
    <div class="menu-card">
      <img src="assets/img/mario.gif" alt="Mario" class="menu-mario">
      <h1>Super Mario Runner</h1>
      <p class="subtitle">O clássico agora no seu navegador!</p>
      <button class="start" onclick="startGame()">▶ Iniciar Jogo</button>
      <div class="instructions">
        <p>Pressione <kbd>ESPAÇO</kbd> para pular</p>
      </div>
    </div>
  </div>

  <div class="game-container">
    <div class="pause-menu" style="display: none;">
      <div class="menu-card">
        <h1>PAUSADO</h1>
        <button class="start" onclick="togglePause()">▶ Continuar</button>
        <button class="start btn-secondary" onclick="restartGame()">↺ Reiniciar</button>
      </div>
    </div>

    <div class="game">
      <div class="hud">
        <div class="score-box">
          <span class="score-label">SCORE</span>
          <span class="score">000000</span>
        </div>
        <div class="center-hud">
          <div class="level-indicator">NÍVEL <span class="level-value">1</span></div>
          <div class="combo-text" id="combo-text">COMBO x3!</div>
        </div>
        <div class="lives-box">
          <span class="lives-label">LIVES</span>
          <span class="lives">❤️❤️❤️</span>
        </div>
      </div>
      <div id="countdown-display" style="display: none;">3</div>
      <img class="mario" src="assets/img/mario.gif" alt="mario">
      <img class="obstacle pipe" id="obstacle" src="assets/img/pipe.png" alt="obstáculo">
      <img class="powerup" id="powerup" src="assets/img/mushroom.png" alt="cogumelo">
      <img class="clouds" src="assets/img/clouds.png" alt="nuvem">
      <img class="ground" src="assets/img/ground2.png" alt="chão">
      <button class="jump-button">Pular</button>
      <button class="pause-button">⏸</button>
    </div>

    <div class="game-over">
      <div class="menu-card">
        <h1>Game Over</h1>
        <div class="stats-container">
          <div class="stat-box">
            <span class="stat-label">SCORE</span>
            <span class="stat-value final-score">000000</span>
          </div>
          <div class="stat-box">
            <span class="stat-label">HIGH SCORE</span>
            <span class="stat-value high-score">000000</span>
          </div>
          <div class="stat-box">
            <span class="stat-label">NÍVEL</span>
            <span class="stat-value final-level">1</span>
          </div>
        </div>
        <button class="start" onclick="restartGame()">↺ Jogar Novamente</button>
      </div>
    </div>
  </div>

  <audio id="theme" src="assets/audio/theme.mp3" loop></audio>
  <audio id="jump" src="assets/audio/jump.mp3"></audio>
  <audio id="gameover" src="assets/audio/gameover.mp3"></audio>
  <audio id="score" src="assets/audio/score.mp3"></audio>
  <audio id="damage" src="assets/audio/damage.mp3"></audio>
  <script src="js/script.js"></script>
</body>

</html>

</html>
